services:
  mongo:
    image: mongo:8.3
    container_name: sim-anillos-mongo
    restart: unless-stopped
    ports:
      - "27017:27017"
    volumes:
      - ./mongo_data:/data/db
    environment:
      MONGO_INITDB_DATABASE: anillos

  mongo-express:
    image: mongo-express:1.0.2
    container_name: sim-anillos-mongo-express
    restart: unless-stopped
    ports:
      - "8081:8081"
    environment:
      ME_CONFIG_MONGODB_SERVER: mongo
      ME_CONFIG_BASICAUTH: "false"
    depends_on:
      - mongo
